<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante — Nombre</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/body.css">
  <link rel="stylesheet" href="css/footer.css">
</head>
<body>

  <!-- ============================================
       HEADER / NAVBAR  → rama: feature/navbar
       ============================================ -->
  <header class="navbar" id="navbar">
  <div class="navbar__contenedor">
    <a href="#" class="navbar__logo">La Buena Mesa</a>
    <nav class="navbar__nav" aria-label="Menú principal">
      <ul>
        <li><a href="#" class="navbar__link activo" data-seccion="menu">Menú</a></li>
        <li><a href="#" class="navbar__link" data-seccion="nosotros">Nosotros</a></li>
        <li><a href="#" class="navbar__link" data-modal="modal-reserva">Reservas</a></li>
      </ul>
    </nav>
  </div>
</header>

  <!-- ============================================
       BODY / MAIN  → rama: feature/body
       ============================================ -->
  <main class="contenido" id="contenido">

    <!-- Sección Menú (visible por defecto) -->
    <section class="seccion activa" id="seccion-menu">
      <!-- Se rellena en la rama feature/body -->
    </section>

    <!-- Sección Nosotros -->
    <section class="seccion" id="seccion-nosotros">
      <!-- Se rellena en la rama feature/body -->
    </section>

  </main>

  <!-- ============================================
       FOOTER  → rama: feature/footer
       ============================================ -->
  <footer class="footer" id="footer">
    <!-- Se rellena en la rama feature/footer -->
  </footer>

  <!-- ============================================
       MODALES (compartidos, cada rama rellena el suyo)
       ============================================ -->

  <!-- Modal de Reservas → rama navbar -->
  <div class="modal-overlay" id="modal-reserva" aria-hidden="true">
    <div class="modal modal--reserva" role="dialog" aria-modal="true" aria-labelledby="titulo-reserva">
      <button class="modal-cerrar" aria-label="Cerrar">&times;</button>
      <h2 id="titulo-reserva">Reservas</h2>
      <p>Lo sentimos, por el momento <strong>todas nuestras mesas están agotadas</strong>.</p>
      <p>Te invitamos a volver a intentarlo más adelante.</p>
      <button class="btn btn--primario" data-cerrar-modal>Entendido</button>
    </div>
  </div>

  <!-- Modal de Plato → rama body -->
  <div class="modal-overlay" id="modal-plato" aria-hidden="true">
    <!-- Se rellena en la rama feature/body -->
  </div>

  <!-- Scripts -->
  <script src="js/navbar.js"></script>
  <script src="js/body.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
